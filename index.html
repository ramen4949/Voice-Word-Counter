<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>音声ワードカウンター</title>
  <!-- Google Fonts 読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bungee&family=Caveat:wght@700&family=Dela+Gothic+One&family=Fredoka:wght@600&family=Hachi+Maru+Pop&family=Kiwi+Maru:wght@500&family=Kosugi+Maru&family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@700&family=Orbitron:wght@700&family=Pacifico&family=Permanent+Marker&family=Poppins:wght@700&family=Rampart+One&family=Reggae+One&family=Righteous&family=RocknRoll+One&family=Shippori+Mincho:wght@700&family=Yuji+Boku&family=Zen+Kurenaido&family=Zen+Maru+Gothic:wght@700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      background-color: #f3f4f6;
      color: #111827;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #1f2937;
    }

    button {
      cursor: pointer;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn-primary { background: #3b82f6; color: white; }
    .btn-primary:hover { background: #2563eb; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-danger:hover { background: #dc2626; }
    .btn-secondary { background: #e5e7eb; color: #374151; }
    .btn-secondary:hover { background: #d1d5db; }

    main {
      flex: 1;
      padding: 24px;
      max-width: 1000px;
      margin: 0 auto;
      width: 100%;
    }

    /* ホーム画面 */
    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .project-card {
      background: white;
      border-radius: 12px;
      padding: 16px;
      border: 2px solid #e5e7eb;
      position: relative;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .project-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    }

    .project-delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      background: #fee2e2;
      color: #ef4444;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      font-size: 14px;
    }
    .project-delete-btn:hover { background: #ef4444; color: white; }

    .project-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 8px; }
    .project-date { font-size: 0.8rem; color: #6b7280; }

    /* 編集画面 */
    .editor-layout {
      display: flex;
      flex-direction: column;
      gap: 24px;
      align-items: center;
    }

    /* オーバーレイカード */
    .counter-stage {
      position: relative;
      width: 100%;
      max-width: 800px;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    .counter-card {
      position: relative;
      width: 100%;
      min-height: 160px;
      border-radius: 20px;
      border: 4px solid #4b5563;
      background-color: #1f2937;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3);
      overflow: visible !important; /* エフェクト見切れ防止 */
    }

    /* エフェクト領域 */
    .effects-container {
      position: absolute;
      top: -40px;
      left: 0;
      width: 100%;
      height: 60px;
      pointer-events: none;
      z-index: 100;
      overflow: visible;
    }

    .popup-effect {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;
      white-space: nowrap;
      animation: popupAnim 0.8s ease-out forwards;
      pointer-events: none;
    }

    @keyframes popupAnim {
      0% { opacity: 0; transform: translate(-50%, 20px) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -20px) scale(1.2); }
      100% { opacity: 0; transform: translate(-50%, -50px) scale(1); }
    }

    .count-display-wrapper {
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .rec-dot {
      width: 16px;
      height: 16px;
      background-color: #ef4444;
      border-radius: 50%;
      opacity: 0.3;
    }
    .rec-dot.active {
      opacity: 1;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1.1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    .count-number { line-height: 1; user-select: none; }

    .progress-container {
      width: 80%;
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 10;
    }

    .progress-bar-bg {
      flex: 1;
      height: 16px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #3b82f6;
      transition: width 0.3s ease;
      border-radius: 10px;
    }

    .progress-meta {
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .custom-layer {
      position: absolute;
      cursor: move;
      user-select: none;
      z-index: 20;
    }

    /* 配信操作・パネル */
    .control-panel-row {
      display: flex;
      gap: 16px;
      width: 100%;
      max-width: 800px;
    }

    .speech-log-box {
      flex: 1;
      background: white;
      border-radius: 12px;
      padding: 16px;
      border: 1px solid #e5e7eb;
      max-height: 120px;
      overflow-y: auto;
    }
    .speech-log-item { font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid #f3f4f6; color: #4b5563; }

    .settings-panel {
      width: 100%;
      max-width: 800px;
      background: white;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #e5e7eb;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 2px solid #f3f4f6;
      margin-bottom: 20px;
    }
    .tab-btn {
      background: none;
      border: none;
      padding: 8px 16px;
      font-weight: bold;
      color: #6b7280;
      border-bottom: 3px solid transparent;
      border-radius: 0;
    }
    .tab-btn.active { color: #3b82f6; border-bottom-color: #3b82f6; }

    .tab-content { display: none; }
    .tab-content.active { display: flex; flex-direction: column; gap: 16px; }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: bold; color: #374151; }
    .form-row { display: flex; gap: 12px; align-items: center; }

    input[type="text"], input[type="number"], select {
      padding: 8px 12px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    /* 配信（開始）時 非表示設定 */
    body.live-mode header,
    body.live-mode .speech-log-box,
    body.live-mode .settings-panel,
    body.live-mode .non-live-ui {
      display: none !important;
    }
  </style>
</head>
<body>

  <header>
    <div class="app-title">音声ワードカウンター</div>
    <button id="btn-home" class="btn-secondary" style="display: none;" onclick="showHome()">← ホーム一覧へ</button>
  </header>

  <main>
    <!-- ホーム画面 -->
    <div id="view-home">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>作品一覧</h2>
        <button class="btn-primary" onclick="createNewProject()">＋ 新規作成</button>
      </div>
      <div id="project-list" class="project-grid"></div>
    </div>

    <!-- 編集・カウンター画面 -->
    <div id="view-editor" class="editor-layout" style="display: none;">
      
      <div class="counter-stage">
        <div id="counter-card" class="counter-card">
          <div id="effects-container" class="effects-container"></div>

          <div class="count-display-wrapper">
            <div id="rec-dot" class="rec-dot"></div>
            <div id="count-number" class="count-number">0</div>
          </div>

          <div id="progress-container" class="progress-container">
            <div class="progress-bar-bg">
              <div id="progress-fill" class="progress-bar-fill"></div>
            </div>
            <div class="progress-meta">
              <span id="meter-icon">🤌</span>
              <span id="meter-percent">0.0%</span>
            </div>
          </div>
        </div>
      </div>

      <div class="control-panel-row non-live-ui">
        <button id="btn-toggle-mic" class="btn-primary" style="font-size: 1.1rem; padding: 12px 24px;" onclick="toggleSpeech()">▶ 開始 (マイクON)</button>
        <div class="speech-log-box">
          <div style="font-weight: bold; margin-bottom: 4px; font-size: 0.8rem; color: #9ca3af;">発言履歴</div>
          <div id="speech-log-list"></div>
        </div>
      </div>

      <!-- 設定パネル -->
      <div class="settings-panel non-live-ui">
        <div class="tabs">
          <button class="tab-btn active" onclick="switchTab('tab-basic', event)">基本・ワード</button>
          <button class="tab-btn" onclick="switchTab('tab-style', event)">デザイン・色</button>
          <button class="tab-btn" onclick="switchTab('tab-meter', event)">メーター設定</button>
          <button class="tab-btn" onclick="switchTab('tab-effects', event)">上昇エフェクト</button>
          <button class="tab-btn" onclick="switchTab('tab-layers', event)">カスタムレイヤー</button>
        </div>

        <!-- 基本設定 -->
        <div id="tab-basic" class="tab-content active">
          <div class="form-group">
            <label>作品タイトル</label>
            <input type="text" id="input-proj-name" oninput="updateCurrentProjectData()">
          </div>
          <div class="form-group">
            <label>反応するキーワード（カンマ区切りで複数指定可）</label>
            <input type="text" id="input-keywords" placeholder="例: すごい,かわいい,神" oninput="updateCurrentProjectData()">
          </div>
          <div class="form-row">
            <div class="form-group" style="flex:1;">
              <label>現在のカウント</label>
              <input type="number" id="input-count" value="0" onchange="updateCurrentProjectData()">
            </div>
            <div class="form-group" style="flex:1;">
              <label>目標カウント</label>
              <input type="number" id="input-target" value="100" onchange="updateCurrentProjectData()">
            </div>
          </div>
        </div>

        <!-- デザイン・色設定 -->
        <div id="tab-style" class="tab-content">
          <div class="form-group">
            <label>フォント選択</label>
            <select id="select-font" onchange="updateCurrentProjectData()"></select>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label>文字サイズ(px)</label>
              <input type="number" id="input-font-size" value="64" onchange="updateCurrentProjectData()">
            </div>
            <div class="form-group">
              <label>文字色タイプ</label>
              <select id="select-text-color-type" onchange="updateCurrentProjectData()">
                <option value="single">単色</option>
                <option value="gradient">グラデーション</option>
              </select>
            </div>
          </div>
          <div class="form-row" id="text-color-single-group">
            <div class="form-group">
              <label>文字色</label>
              <input type="color" id="input-text-color" value="#ffffff" onchange="updateCurrentProjectData()">
            </div>
          </div>
          <div class="form-row" id="text-color-grad-group" style="display:none;">
            <div class="form-group"><label>開始色</label><input type="color" id="input-text-grad-1" value="#ff7e5f" onchange="updateCurrentProjectData()"></div>
            <div class="form-group"><label>終了色</label><input type="color" id="input-text-grad-2" value="#feb47b" onchange="updateCurrentProjectData()"></div>
            <div class="form-group"><label>角度(deg)</label><input type="number" id="input-text-grad-deg" value="90" onchange="updateCurrentProjectData()"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>カード背景色</label><input type="color" id="input-bg-color" value="#1f2937" onchange="updateCurrentProjectData()"></div>
            <div class="form-group"><label>枠線色</label><input type="color" id="input-border-color" value="#4b5563" onchange="updateCurrentProjectData()"></div>
          </div>
        </div>

        <!-- メーター設定 -->
        <div id="tab-meter" class="tab-content">
          <div class="form-group">
            <label>メーター横のテキスト/絵文字</label>
            <input type="text" id="input-meter-icon" value="🤌" oninput="updateCurrentProjectData()">
          </div>
          <div class="form-group">
            <label>パーセンテージフォント</label>
            <select id="select-meter-font" onchange="updateCurrentProjectData()"></select>
          </div>
          <div class="form-row">
            <div class="form-group"><label>文字サイズ(px)</label><input type="number" id="input-meter-size" value="16" onchange="updateCurrentProjectData()"></div>
            <div class="form-group"><label>文字色</label><input type="color" id="input-meter-color" value="#ffffff" onchange="updateCurrentProjectData()"></div>
          </div>
        </div>

        <!-- 上昇エフェクト設定 -->
        <div id="tab-effects" class="tab-content">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="font-weight:bold;">エフェクト一覧（カウント時にランダム表示）</label>
            <button class="btn-secondary" onclick="addEffectPreset()">＋ 追加</button>
          </div>
          <div id="effects-list-editor" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

        <!-- カスタムレイヤー設定 -->
        <div id="tab-layers" class="tab-content">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label style="font-weight:bold;">ドラッグ配置レイヤー</label>
            <div style="display:flex; gap:8px;">
              <button class="btn-secondary" onclick="addCustomLayer('text')">＋ テキスト</button>
              <button class="btn-secondary" onclick="addCustomLayer('image')">＋ 画像</button>
            </div>
          </div>
          <div id="layers-list-editor" style="display:flex; flex-direction:column; gap:10px;"></div>
        </div>

      </div>
    </div>
  </main>

  <script>
    const FONT_OPTIONS = [
      'Noto Sans JP', 'Dela Gothic One', 'Mochiy Pop One', 'Zen Maru Gothic',
      'Kiwi Maru', 'Rampart One', 'Hachi Maru Pop', 'Shippori Mincho',
      'Zen Kurenaido', 'Yuji Boku', 'Kosugi Maru', 'RocknRoll One',
      'Reggae One', 'Orbitron', 'Bungee', 'Pacifico', 'Fredoka',
      'Anton', 'Righteous', 'Permanent Marker', 'Poppins', 'Caveat'
    ];

    let projects = [];
    let currentProjId = null;
    let recognition = null;
    let isListening = false;
    let lastRecognizedTime = 0; // 重複カウント防止用タイムスタンプ

    window.addEventListener('DOMContentLoaded', () => {
      populateFontDropdowns();
      loadProjectsFromStorage();
      showHome();
      setupSpeechRecognition();
    });

    function populateFontDropdowns() {
      const selects = [document.getElementById('select-font'), document.getElementById('select-meter-font')];
      selects.forEach(select => {
        select.innerHTML = '';
        FONT_OPTIONS.forEach(font => {
          const opt = document.createElement('option');
          opt.value = font;
          opt.textContent = font;
          opt.style.fontFamily = `'${font}', sans-serif`;
          select.appendChild(opt);
        });
      });
    }

    function loadProjectsFromStorage() {
      const data = localStorage.getItem('voice_word_counter_projects');
      if (data) {
        try { projects = JSON.parse(data); } catch(e) { projects = []; }
      }
    }

    function saveProjectsToStorage() {
      localStorage.setItem('voice_word_counter_projects', JSON.stringify(projects));
    }

    function showHome() {
      if (isListening) stopSpeech();
      document.body.classList.remove('live-mode');
      document.getElementById('view-home').style.display = 'block';
      document.getElementById('view-editor').style.display = 'none';
      document.getElementById('btn-home').style.display = 'none';
      renderHome();
    }

    function renderHome() {
      const listContainer = document.getElementById('project-list');
      listContainer.innerHTML = '';

      projects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'project-card';
        card.onclick = () => openProject(p.id);

        const delBtn = document.createElement('button');
        delBtn.className = 'project-delete-btn';
        delBtn.innerHTML = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          deleteProject(p.id);
        };

        const name = document.createElement('div');
        name.className = 'project-name';
        name.textContent = p.name || '無題のプロジェクト';

        const date = document.createElement('div');
        date.className = 'project-date';
        date.textContent = '最終更新: ' + new Date(p.updatedAt).toLocaleString();

        card.appendChild(delBtn);
        card.appendChild(name);
        card.appendChild(date);
        listContainer.appendChild(card);
      });
    }

    function createNewProject() {
      const newProj = {
        id: 'proj_' + Date.now(),
        name: '新規カウンター',
        updatedAt: Date.now(),
        keywords: ['すごい', '神'],
        count: 0,
        target: 100,
        font: 'Mochiy Pop One',
        fontSize: 64,
        textColorType: 'single',
        textColor: '#ffffff',
        textGrad1: '#ff7e5f',
        textGrad2: '#feb47b',
        textGradDeg: 90,
        bgColor: '#1f2937',
        borderColor: '#4b5563',
        meterIcon: '🤌',
        meterFont: 'Noto Sans JP',
        meterSize: 16,
        meterColor: '#ffffff',
        effects: [
          { text: '+1', color: '#3b82f6', font: 'Mochiy Pop One' },
          { text: 'Nice!', color: '#10b981', font: 'Fredoka' }
        ],
        layers: []
      };
      projects.unshift(newProj);
      saveProjectsToStorage();
      openProject(newProj.id);
    }

    function deleteProject(id) {
      projects = projects.filter(p => p.id !== id);
      saveProjectsToStorage();
      renderHome();
    }

    function openProject(id) {
      currentProjId = id;
      document.getElementById('view-home').style.display = 'none';
      document.getElementById('view-editor').style.display = 'flex';
      document.getElementById('btn-home').style.display = 'inline-block';
      
      loadProjectToForm();
      renderPreview();
    }

    function getActiveProject() {
      return projects.find(p => p.id === currentProjId);
    }

    function loadProjectToForm() {
      const p = getActiveProject();
      if (!p) return;

      document.getElementById('input-proj-name').value = p.name;
      document.getElementById('input-keywords').value = p.keywords.join(',');
      document.getElementById('input-count').value = p.count;
      document.getElementById('input-target').value = p.target;
      
      document.getElementById('select-font').value = p.font;
      document.getElementById('input-font-size').value = p.fontSize;
      document.getElementById('select-text-color-type').value = p.textColorType;
      document.getElementById('input-text-color').value = p.textColor;
      document.getElementById('input-text-grad-1').value = p.textGrad1;
      document.getElementById('input-text-grad-2').value = p.textGrad2;
      document.getElementById('input-text-grad-deg').value = p.textGradDeg;
      document.getElementById('input-bg-color').value = p.bgColor;
      document.getElementById('input-border-color').value = p.borderColor;

      document.getElementById('input-meter-icon').value = p.meterIcon;
      document.getElementById('select-meter-font').value = p.meterFont;
      document.getElementById('input-meter-size').value = p.meterSize;
      document.getElementById('input-meter-color').value = p.meterColor;

      renderEffectsEditor();
      renderLayersEditor();
    }

    function updateCurrentProjectData() {
      const p = getActiveProject();
      if (!p) return;

      p.name = document.getElementById('input-proj-name').value;
      p.keywords = document.getElementById('input-keywords').value.split(',').map(s => s.trim()).filter(Boolean);
      p.count = parseInt(document.getElementById('input-count').value) || 0;
      p.target = parseInt(document.getElementById('input-target').value) || 100;
      
      p.font = document.getElementById('select-font').value;
      p.fontSize = parseInt(document.getElementById('input-font-size').value) || 64;
      p.textColorType = document.getElementById('select-text-color-type').value;
      p.textColor = document.getElementById('input-text-color').value;
      p.textGrad1 = document.getElementById('input-text-grad-1').value;
      p.textGrad2 = document.getElementById('input-text-grad-2').value;
      p.textGradDeg = parseInt(document.getElementById('input-text-grad-deg').value) || 90;
      p.bgColor = document.getElementById('input-bg-color').value;
      p.borderColor = document.getElementById('input-border-color').value;

      p.meterIcon = document.getElementById('input-meter-icon').value;
      p.meterFont = document.getElementById('select-meter-font').value;
      p.meterSize = parseInt(document.getElementById('input-meter-size').value) || 16;
      p.meterColor = document.getElementById('input-meter-color').value;
      p.updatedAt = Date.now();

      document.getElementById('text-color-single-group').style.display = p.textColorType === 'single' ? 'flex' : 'none';
      document.getElementById('text-color-grad-group').style.display = p.textColorType === 'gradient' ? 'flex' : 'none';

      saveProjectsToStorage();
      renderPreview();
    }

    function renderPreview() {
      const p = getActiveProject();
      if (!p) return;

      const card = document.getElementById('counter-card');
      card.style.backgroundColor = p.bgColor;
      card.style.borderColor = p.borderColor;

      const numEl = document.getElementById('count-number');
      numEl.textContent = p.count.toLocaleString();
      numEl.style.fontFamily = `'${p.font}', sans-serif`;
      numEl.style.fontSize = p.fontSize + 'px';

      if (p.textColorType === 'gradient') {
        numEl.style.background = `linear-gradient(${p.textGradDeg}deg, ${p.textGrad1}, ${p.textGrad2})`;
        numEl.style.webkitBackgroundClip = 'text';
        numEl.style.webkitTextFillColor = 'transparent';
      } else {
        numEl.style.background = 'none';
        numEl.style.webkitBackgroundClip = 'unset';
        numEl.style.webkitTextFillColor = 'initial';
        numEl.style.color = p.textColor;
      }

      const pct = Math.min(100, Math.max(0, (p.count / p.target) * 100)).toFixed(1);
      document.getElementById('progress-fill').style.width = pct + '%';
      
      const pctEl = document.getElementById('meter-percent');
      pctEl.textContent = pct + '%';
      pctEl.style.fontFamily = `'${p.meterFont}', sans-serif`;
      pctEl.style.fontSize = p.meterSize + 'px';
      pctEl.style.color = p.meterColor;

      document.getElementById('meter-icon').textContent = p.meterIcon;

      renderCustomLayersDOM();
    }

    function renderCustomLayersDOM() {
      const p = getActiveProject();
      const card = document.getElementById('counter-card');

      card.querySelectorAll('.custom-layer').forEach(el => el.remove());

      p.layers.forEach((layer, idx) => {
        const div = document.createElement('div');
        div.className = 'custom-layer';
        div.style.left = layer.x + 'px';
        div.style.top = layer.y + 'px';

        if (layer.type === 'text') {
          div.textContent = layer.content;
          div.style.fontFamily = `'${layer.font || 'Noto Sans JP'}', sans-serif`;
          div.style.fontSize = (layer.fontSize || 24) + 'px';
          div.style.color = layer.color || '#ffffff';
        } else if (layer.type === 'image') {
          const img = document.createElement('img');
          img.src = layer.content;
          img.style.width = (layer.width || 80) + 'px';
          img.style.pointerEvents = 'none';
          div.appendChild(img);
        }

        div.onmousedown = (e) => startDrag(e, idx);
        card.appendChild(div);
      });
    }

    function startDrag(e, index) {
      const p = getActiveProject();
      const layer = p.layers[index];
      const startX = e.clientX - layer.x;
      const startY = e.clientY - layer.y;

      function onMouseMove(e) {
        layer.x = e.clientX - startX;
        layer.y = e.clientY - startY;
        renderCustomLayersDOM();
      }

      function onMouseUp() {
        document.removeEventListener('mousemove', onMouseMove);
        document.removeEventListener('mouseup', onMouseUp);
        saveProjectsToStorage();
      }

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    }

    function renderEffectsEditor() {
      const p = getActiveProject();
      const container = document.getElementById('effects-list-editor');
      container.innerHTML = '';

      p.effects.forEach((eff, idx) => {
        const row = document.createElement('div');
        row.className = 'form-row';

        const textInput = document.createElement('input');
        textInput.type = 'text';
        textInput.value = eff.text;
        textInput.style.flex = '1';
        textInput.oninput = (e) => {
          eff.text = e.target.value;
          saveProjectsToStorage();
        };

        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.value = eff.color;
        colorInput.onchange = (e) => {
          eff.color = e.target.value;
          saveProjectsToStorage();
        };

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-danger';
        delBtn.textContent = '削除';
        delBtn.onclick = () => {
          p.effects.splice(idx, 1);
          saveProjectsToStorage();
          renderEffectsEditor();
        };

        row.appendChild(textInput);
        row.appendChild(colorInput);
        row.appendChild(delBtn);
        container.appendChild(row);
      });
    }

    function addEffectPreset() {
      const p = getActiveProject();
      p.effects.push({ text: 'Nice!', color: '#3b82f6', font: 'Mochiy Pop One' });
      saveProjectsToStorage();
      renderEffectsEditor();
    }

    function renderLayersEditor() {
      const p = getActiveProject();
      const container = document.getElementById('layers-list-editor');
      container.innerHTML = '';

      p.layers.forEach((layer, idx) => {
        const box = document.createElement('div');
        box.style.border = '1px solid #e5e7eb';
        box.style.padding = '10px';
        box.style.borderRadius = '8px';
        box.style.display = 'flex';
        box.style.flexDirection = 'column';
        box.style.gap = '8px';

        const head = document.createElement('div');
        head.style.display = 'flex';
        head.style.justifyContent = 'space-between';
        head.innerHTML = `<strong>レイヤー ${idx + 1} (${layer.type})</strong>`;

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-danger';
        delBtn.textContent = '削除';
        delBtn.style.padding = '2px 8px';
        delBtn.onclick = () => {
          p.layers.splice(idx, 1);
          saveProjectsToStorage();
          renderLayersEditor();
          renderPreview();
        };
        head.appendChild(delBtn);

        const contentInput = document.createElement('input');
        contentInput.type = 'text';
        contentInput.value = layer.content;
        contentInput.placeholder = layer.type === 'text' ? '表示文字' : '画像URL';
        contentInput.oninput = (e) => {
          layer.content = e.target.value;
          saveProjectsToStorage();
          renderCustomLayersDOM();
        };

        box.appendChild(head);
        box.appendChild(contentInput);
        container.appendChild(box);
      });
    }

    function addCustomLayer(type) {
      const p = getActiveProject();
      if (type === 'text') {
        p.layers.push({ type: 'text', content: 'テキスト', x: 20, y: 20, fontSize: 24, color: '#ffffff', font: 'Noto Sans JP' });
      } else {
        p.layers.push({ type: 'image', content: 'https://via.placeholder.com/50', x: 50, y: 50, width: 60 });
      }
      saveProjectsToStorage();
      renderLayersEditor();
      renderPreview();
    }

    function setupSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('お使いのブラウザは音声認識に対応していません。(Chrome推奨)');
        return;
      }

      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = false;
      recognition.lang = 'ja-JP';

      recognition.onresult = (event) => {
        const p = getActiveProject();
        if (!p) return;

        const now = Date.now();
        // 500ms以内の連続反応（重複発火）をブロック
        if (now - lastRecognizedTime < 500) return;

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            const transcript = event.results[i][0].transcript.trim();
            
            let matched = false;
            p.keywords.forEach(kw => {
              if (kw && transcript.includes(kw) && !matched) {
                matched = true;
                lastRecognizedTime = now;
                p.count += 1;
                document.getElementById('input-count').value = p.count;
                saveProjectsToStorage();
                renderPreview();
                triggerEffect();
                logSpeech(`${transcript} (検知: ${kw})`);
              }
            });
          }
        }
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
      };
    }

    function toggleSpeech() {
      if (isListening) stopSpeech();
      else startSpeech();
    }

    function startSpeech() {
      if (!recognition) return;
      isListening = true;
      recognition.start();
      document.getElementById('rec-dot').classList.add('active');
      document.getElementById('btn-toggle-mic').textContent = '⏸ 停止 (配信中)';
      document.getElementById('btn-toggle-mic').classList.replace('btn-primary', 'btn-danger');
      document.body.classList.add('live-mode');
    }

    function stopSpeech() {
      if (!recognition) return;
      isListening = false;
      recognition.stop();
      document.getElementById('rec-dot').classList.remove('active');
      document.getElementById('btn-toggle-mic').textContent = '▶ 開始 (マイクON)';
      document.getElementById('btn-toggle-mic').classList.replace('btn-danger', 'btn-primary');
      document.body.classList.remove('live-mode');
    }

    function logSpeech(text) {
      const list = document.getElementById('speech-log-list');
      const item = document.createElement('div');
      item.className = 'speech-log-item';
      item.textContent = `[${new Date().toLocaleTimeString()}] ${text}`;
      list.insertBefore(item, list.firstChild);
    }

    function triggerEffect() {
      const p = getActiveProject();
      if (!p || !p.effects || p.effects.length === 0) return;

      const eff = p.effects[Math.floor(Math.random() * p.effects.length)];
      const container = document.getElementById('effects-container');

      const el = document.createElement('div');
      el.className = 'popup-effect';
      el.textContent = eff.text;
      el.style.color = eff.color;
      el.style.fontFamily = `'${eff.font || 'Mochiy Pop One'}', sans-serif`;
      el.style.fontSize = '32px';

      container.appendChild(el);
      setTimeout(() => el.remove(), 800);
    }

    function switchTab(tabId, evt) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));

      evt.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }
  </script>
</body>
</html>
